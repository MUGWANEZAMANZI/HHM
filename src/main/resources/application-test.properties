# ── Test profile ──────────────────────────────────────────────────────────────
# Active when: spring.profiles.active=test  (set this in CI or test runner)
# Intended for automated testing — points at a separate test schema so tests
# never corrupt production or development data.
dbName=hhm_test
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/${dbName}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# No stack traces in test output — keep assertions clean
server.error.include-stacktrace=never
server.error.include-message=always

logging.level.root=WARN
logging.level.com.aop=OFF
