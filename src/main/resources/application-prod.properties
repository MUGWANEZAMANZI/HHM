# ── Prod profile ─────────────────────────────────────────────────────────────
# Active when: spring.profiles.active=prod
# Switch to this profile before deploying to production.
# Replace placeholder values with real credentials via environment variables.
dbName=${DB_NAME:hhm}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${dbName}?useSSL=true&serverTimezone=UTC

# Hide stack traces from API consumers in production
server.error.include-stacktrace=never
server.error.include-message=never

# Info-level only in production
logging.level.root=INFO
logging.level.com.aop=INFO
logging.level.com.service=INFO
