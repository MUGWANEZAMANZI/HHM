# ── Dev profile ──────────────────────────────────────────────────────────────
# Active when: spring.profiles.active=dev  (set in application.properties)
# Use for local development — debug logging, local MySQL, detailed errors
dbName=hhm2
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/${dbName}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Show full stack traces in responses (dev only)
server.error.include-stacktrace=always
server.error.include-message=always

# Fix Swagger UI sending sort as JSON array (["name"]) instead of plain string
springdoc.pageable-resolver.enabled=true

# Debug-level logging for AOP and our packages
logging.level.com.aop=DEBUG
logging.level.com.service=DEBUG
logging.level.com.repository=DEBUG
logging.level.root=INFO
