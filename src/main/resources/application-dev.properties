# ── Dev profile ──────────────────────────────────────────────────────────────
# Active when: spring.profiles.active=dev  (set in application.properties)
# Use for local development — debug logging, local MySQL, detailed errors
dbName=hhm
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/${dbName}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Show full stack traces in responses (dev only)
server.error.include-stacktrace=always
server.error.include-message=always

# Debug-level logging for AOP and our packages
logging.level.com.aop=DEBUG
logging.level.com.service=DEBUG
logging.level.com.dao=DEBUG
logging.level.root=INFO
