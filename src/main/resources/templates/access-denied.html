<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen p-4">

<div class="max-w-sm w-full p-8 bg-white shadow-lg rounded-2xl text-center border border-slate-100">

  <!-- Icon -->
  <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-rose-50 text-rose-500 mb-5">
    <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
  </div>

  <!-- Title -->
  <span class="text-xs font-semibold tracking-wider text-rose-500 uppercase bg-rose-50 px-3 py-1 rounded-full">403 Error</span>
  <h1 class="text-xl font-bold text-slate-900 mt-3">Access Denied</h1>

  <!-- Description -->
  <p class="text-sm text-slate-500 mt-2 mb-6">
    You don't have the required permissions to view this resource.
  </p>

  <!-- User Context (if authenticated) -->
  <div class="mb-6 p-2.5 bg-slate-50 rounded-lg text-xs text-slate-600 border border-slate-200" sec:authorize="isAuthenticated()">
    Logged in as: <strong class="text-slate-800" sec:authentication="name">User</strong>
  </div>

  <!-- Actions -->
  <div class="space-y-2">
    <a th:href="@{/dashboard}" class="w-full flex justify-center items-center py-2.5 px-4 text-sm font-medium rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 transition">
      Dashboard
    </a>
    <a th:href="@{/logout}" class="w-full flex justify-center items-center py-2.5 px-4 text-sm font-medium rounded-xl text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
      Sign Out
    </a>
  </div>

</div>

</body>
</html>
